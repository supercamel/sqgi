name: Native Windows packaging
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu cross-build and execution tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build meson pkg-config gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 gobject-introspection libgirepository1.0-dev wine64 xvfb
      - name: Prepare Ooblerg target dependencies
        run: python3 tools/prepare-windows-sdk.py --cross --root "$RUNNER_TEMP/ooblerg" --cache "$RUNNER_TEMP/ooblerg-cache"
      - name: Verify package provider and Linux SDK exports
        run: |
          python3 tools/sqgipkg_tests/test_ooblerg.py
          python3 tools/sqgipkg_tests/test_native_sdk.py
      - name: Cross-build SQGI with LLVM and kernels
        run: |
          cmake -S . -B build-cross -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=tools/mingw/toolchain_mingw64.cmake \
            -DSQGI_WINDOWS_SYSROOT="$RUNNER_TEMP/ooblerg" \
            -DSQGI_LLVM_INCLUDE_DIR="$RUNNER_TEMP/ooblerg/mingw64/include" \
            -DSQGI_LLVM_LIBRARY="$RUNNER_TEMP/ooblerg/mingw64/lib/LLVM-C.lib" \
            -DCMAKE_CROSSCOMPILING_EMULATOR="$GITHUB_WORKSPACE/tools/run_wine_test.py"
          cmake --build build-cross --parallel 4
      - name: Run Windows LLVM regressions under Wine
        run: |
          export WINEPREFIX="$RUNNER_TEMP/sqgi-wine" WINEDEBUG=-all
          mkdir -p "$WINEPREFIX"
          xvfb-run -a wineboot -u
          export WINEPATH="Z:$RUNNER_TEMP/ooblerg/mingw64/bin;Z:$GITHUB_WORKSPACE/build-cross"
          export GI_TYPELIB_PATH="Z:$RUNNER_TEMP/ooblerg/mingw64/lib/girepository-1.0"
          xvfb-run -a ctest --test-dir build-cross -L 'jit|kernel' -E kernel_packaging --output-on-failure --timeout 60 --no-tests=error --parallel 2 --output-junit "$GITHUB_WORKSPACE/build-cross/wine-tests.xml" || {
            python3 tools/report_ci_failure.py build-cross/wine-tests.xml
            exit 1
          }
      - name: Save cross-build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-cross-test-logs
          path: |
            build-cross/CMakeCache.txt
            build-cross/wine-tests.xml
            build-cross/Testing/Temporary/
  windows:
    runs-on: windows-latest
    env:
      CC: gcc
      CXX: g++
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Ooblerg toolchain and dependencies
        run: |
          $root = "$env:RUNNER_TEMP/sqgi-ooblerg"
          $cache = "$env:RUNNER_TEMP/sqgi-ooblerg-cache"
          python tools/prepare-windows-sdk.py --root $root --cache $cache
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $prefix = "$root/mingw64"
          "$prefix/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "SQGI_TEST_OOBLERG_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SQGI_TEST_OOBLERG_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_PREFIX_PATH=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PKG_CONFIG_LIBDIR=$prefix/lib/pkgconfig;$prefix/share/pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GI_TYPELIB_PATH=$prefix/lib/girepository-1.0" | Out-File -FilePath $env:GITHUB_ENV -Append
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build fast packaging preflight
        run: |
          # Catch path/schema/fixture failures before the default LLVM build.
          # This interpreter build does not replace default-build tests.
          cmake -S . -B build-preflight -G Ninja -DCMAKE_BUILD_TYPE=Release -DSQ_ENABLE_JIT=OFF -DSQGI_ENABLE_KERNELS=OFF 2>&1 | Tee-Object -FilePath preflight-configure.log
          if ($LASTEXITCODE) { python tools/report_ci_failure.py preflight-configure.log; exit 1 }
          cmake --build build-preflight --target sqgi-bin 2>&1 | Tee-Object -FilePath preflight-build.log
          if ($LASTEXITCODE) { python tools/report_ci_failure.py preflight-build.log; exit 1 }
      - name: Fast CLI and manifest preflight
        run: |
          # Only runtime-independent cases belong here. The complete suites
          # (including assertions about enabled JIT/kernels) run below.
          $failed = $false
          python tools/sqgipkg_tests/test_ergonomics.py build-preflight/sqgi.exe -v Ergonomics.test_local_runtime_source_without_revision Ergonomics.test_local_runtime_source_alias Ergonomics.test_nsis_bootstrap_supports_x86_64_payload Ergonomics.test_nsis_compiles_payload_with_spaces Ergonomics.test_ooblerg_target_resolution_and_inspection Ergonomics.test_source_runtime_llvm_and_base_gi_dependencies Ergonomics.test_unicode_script_path_import_and_argument 2>&1 | Tee-Object -FilePath build-preflight/path-tests.log
          if ($LASTEXITCODE) { $failed = $true }
          python tools/sqgipkg_gui/tests/test_contracts.py build-preflight/sqgi.exe -v Contracts.test_document_contracts Contracts.test_protocol_and_equivalence Contracts.test_runtime_choice Contracts.test_native_application_entry_resolution 2>&1 | Tee-Object -FilePath build-preflight/manifest-tests.log
          if ($LASTEXITCODE) { $failed = $true }
          python tools/sqgipkg_gui/tests/test_delivery.py build-preflight/sqgi.exe -v Delivery.test_launch_from_unrelated_directory Delivery.test_traceability 2>&1 | Tee-Object -FilePath build-preflight/delivery-tests.log
          if ($LASTEXITCODE) { $failed = $true }
          if ($failed) { exit 1 }
      - name: Build and install into a path containing spaces
        id: build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release '-DCMAKE_INSTALL_PREFIX=C:/sqgipkg test' "-DSQGI_LLVM_INCLUDE_DIR=$env:SQGI_TEST_OOBLERG_PREFIX/include" "-DSQGI_LLVM_LIBRARY=$env:SQGI_TEST_OOBLERG_PREFIX/lib/LLVM-C.lib" 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE) { python tools/report_ci_failure.py configure.log; exit 1 }
          cmake --build build 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE) { python tools/report_ci_failure.py build.log; exit 1 }
          cmake --install build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: LLVM JIT and typed kernel regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # Verify the defaults too: do not let a backend being disabled make
          # its tests disappear while CI remains green.
          $cache = Get-Content build/CMakeCache.txt
          foreach ($setting in @('SQ_ENABLE_JIT:BOOL=ON', 'SQGI_BYTECODE_JIT_BACKEND:STRING=LLVM', 'SQGI_ENABLE_KERNELS:BOOL=ON', 'SQGI_KERNEL_BACKEND:STRING=LLVM')) {
            if ($cache -notcontains $setting) { throw "Required default build setting missing: $setting" }
          }
          # The packaging contract is exercised separately below.
          ctest --test-dir build -L 'jit|kernel' -E kernel_packaging --output-on-failure --timeout 30 --no-tests=error --output-log build/llvm-tests.log --output-junit "$env:GITHUB_WORKSPACE/build/llvm-tests.xml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Repeated LLVM process lifecycle regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # The COFF allocation failure was intermittent across fresh processes.
          ctest --test-dir build -R '^(sqgi_test_jit_perf_correctness_runtime|sqgi_demo_kernel_matrix_recurrence)$' --repeat until-fail:30 --output-on-failure --timeout 30 --no-tests=error --output-log build/llvm-repeat-tests.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Cairo, callback and checker regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          ctest --test-dir build -R '^sqgi_test_(cairo|cairo_runtime|cairo_pixels|c_cairo|callback_async_lifetime|cpp_sqgicheck|system_module|file_lock)$' --output-on-failure --no-tests=error --output-log build/runtime-tests.log --output-junit "$env:GITHUB_WORKSPACE/build/runtime-tests.xml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: CLI, process, file, schema and native recipe regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # CTest runs every selected suite even when an earlier suite fails.
          ctest --test-dir build -R '^sqgi_test_(sqgipkg_ergonomics|ooblerg_provider|kernel_packaging|windows_ci_guard)$' --output-on-failure --no-tests=error --output-log build/packaging-tests.log --output-junit "$env:GITHUB_WORKSPACE/build/packaging-tests.xml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Manifest authoring contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          ctest --test-dir build -R '^sqgi_test_manifest_(contracts|delivery)$' --output-on-failure --no-tests=error --output-log build/manifest-tests.log --output-junit "$env:GITHUB_WORKSPACE/build/manifest-tests.xml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Installed GUI launcher
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $gui = Start-Process 'C:/sqgipkg test/bin/sqgipkg-gui.exe' -ArgumentList '--help' -Wait -PassThru
          if ($gui.ExitCode) { exit $gui.ExitCode }
      - name: Package and run from PowerShell and CMD
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python tools/sqgipkg_tests/test_windows_native.py 'C:/sqgipkg test/bin/sqgipkg.exe' $env:SQGI_TEST_OOBLERG_CACHE 2>&1 | Tee-Object -FilePath build/native-packaging-tests.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Annotate test failures
        if: failure()
        run: |
          Get-ChildItem build/*tests.xml,build-preflight/*tests.log,build/native-packaging-tests.log -ErrorAction SilentlyContinue | ForEach-Object {
            python tools/report_ci_failure.py $_.FullName
          }
      - name: Save all test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: |
            preflight-*.log
            configure.log
            build.log
            build/*tests.log
            build/*tests.xml
            build/CMakeCache.txt
            build/Testing/Temporary/
            build-preflight/*tests.log
            build-preflight/*tests.xml
            build-preflight/CMakeCache.txt
            build-preflight/Testing/Temporary/
