name: Native Windows packaging
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      CC: gcc
      CXX: g++
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install native toolchain and libraries
        run: |
          # pacman is used as a package source. Every build/test step runs from
          # PowerShell; the MSYS shell and Unix tools are not added to PATH.
          if (!(Test-Path C:\msys64\usr\bin\pacman.exe)) {
            choco install msys2 --yes --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $root = @('C:\msys64', 'C:\tools\msys64') | Where-Object { Test-Path "$_\usr\bin\pacman.exe" } | Select-Object -First 1
          if (!$root) { throw 'MSYS2 package installation not found' }
          $env:MSYSTEM = 'UCRT64'
          & "$root\usr\bin\pacman.exe" -Syu --noconfirm
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$root\usr\bin\pacman.exe" -S --needed --noconfirm mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-glib2 mingw-w64-ucrt-x86_64-gobject-introspection mingw-w64-ucrt-x86_64-cairo mingw-w64-ucrt-x86_64-libffi mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-gtk4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "$root\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "SQGI_TEST_MSYS_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PKG_CONFIG_LIBDIR=$root/ucrt64/lib/pkgconfig;$root/ucrt64/share/pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build fast packaging preflight
        run: |
          # Catch path/schema/fixture failures before spending ~40 minutes on
          # LLVM. This interpreter build does not replace default-build tests.
          cmake -S . -B build-preflight -G Ninja -DCMAKE_BUILD_TYPE=Release -DSQ_ENABLE_JIT=OFF -DSQGI_ENABLE_KERNELS=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-preflight --target sqgi-bin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Fast CLI and manifest preflight
        run: |
          # Only runtime-independent cases belong here. The complete suites
          # (including assertions about enabled JIT/kernels) run below.
          $failed = $false
          python tools/sqgipkg_tests/test_ergonomics.py build-preflight/sqgi.exe -v Ergonomics.test_local_runtime_source_without_revision Ergonomics.test_local_runtime_source_alias Ergonomics.test_nsis_bootstrap_supports_x86_64_payload Ergonomics.test_nsis_compiles_payload_with_spaces Ergonomics.test_ooblerg_target_resolution_and_inspection Ergonomics.test_source_runtime_llvm_and_base_gi_dependencies Ergonomics.test_unicode_script_path_import_and_argument 2>&1 | Tee-Object -FilePath build-preflight/path-tests.log
          if ($LASTEXITCODE) { $failed = $true }
          python tools/sqgipkg_gui/tests/test_contracts.py build-preflight/sqgi.exe -v Contracts.test_document_contracts Contracts.test_protocol_and_equivalence Contracts.test_runtime_choice Contracts.test_native_application_entry_resolution 2>&1 | Tee-Object -FilePath build-preflight/manifest-tests.log
          if ($LASTEXITCODE) { $failed = $true }
          python tools/sqgipkg_gui/tests/test_delivery.py build-preflight/sqgi.exe -v Delivery.test_launch_from_unrelated_directory Delivery.test_traceability 2>&1 | Tee-Object -FilePath build-preflight/delivery-tests.log
          if ($LASTEXITCODE) { $failed = $true }
          if ($failed) { exit 1 }
      - name: Build and install LLVM 18 for the native toolchain
        run: |
          cmake "-DLLVM_INSTALL_PREFIX=$env:SQGI_TEST_MSYS_ROOT/ucrt64" "-DLLVM_BOOTSTRAP_DIR=$env:RUNNER_TEMP/sqgi-llvm18" -P tools/build-llvm18.cmake
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and install into a path containing spaces
        id: build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release '-DCMAKE_INSTALL_PREFIX=C:/sqgipkg test'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: LLVM JIT and typed kernel regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # Verify the defaults too: do not let a backend being disabled make
          # its tests disappear while CI remains green.
          $cache = Get-Content build/CMakeCache.txt
          foreach ($setting in @('SQ_ENABLE_JIT:BOOL=ON', 'SQGI_BYTECODE_JIT_BACKEND:STRING=LLVM', 'SQGI_ENABLE_KERNELS:BOOL=ON', 'SQGI_KERNEL_BACKEND:STRING=LLVM')) {
            if ($cache -notcontains $setting) { throw "Required default build setting missing: $setting" }
          }
          # The packaging contract is exercised separately below.
          ctest --test-dir build -L 'jit|kernel' -E kernel_packaging --output-on-failure --timeout 30 --no-tests=error --output-log build/llvm-tests.log --output-junit "$env:GITHUB_WORKSPACE/build/llvm-tests.xml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Repeated LLVM process lifecycle regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # The COFF allocation failure was intermittent across fresh processes.
          ctest --test-dir build -R '^(sqgi_test_jit_perf_correctness_runtime|sqgi_demo_kernel_matrix_recurrence)$' --repeat until-fail:30 --output-on-failure --timeout 30 --no-tests=error --output-log build/llvm-repeat-tests.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Cairo, callback and checker regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          ctest --test-dir build -R '^sqgi_test_(cairo|cairo_runtime|cairo_pixels|c_cairo|callback_async_lifetime|cpp_sqgicheck|system_module|file_lock)$' --output-on-failure --no-tests=error --output-log build/runtime-tests.log --output-junit "$env:GITHUB_WORKSPACE/build/runtime-tests.xml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: CLI, process, file, schema and native recipe regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # CTest runs every selected suite even when an earlier suite fails.
          ctest --test-dir build -R '^sqgi_test_(sqgipkg_ergonomics|kernel_packaging|windows_ci_guard)$' --output-on-failure --no-tests=error --output-log build/packaging-tests.log --output-junit "$env:GITHUB_WORKSPACE/build/packaging-tests.xml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Manifest authoring contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          ctest --test-dir build -R '^sqgi_test_manifest_(contracts|delivery)$' --output-on-failure --no-tests=error --output-log build/manifest-tests.log --output-junit "$env:GITHUB_WORKSPACE/build/manifest-tests.xml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Installed GUI launcher
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $gui = Start-Process 'C:/sqgipkg test/bin/sqgipkg-gui.exe' -ArgumentList '--help' -Wait -PassThru
          if ($gui.ExitCode) { exit $gui.ExitCode }
      - name: Package and run from PowerShell and CMD
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python tools/sqgipkg_tests/test_windows_native.py 'C:/sqgipkg test/bin/sqgipkg.exe' $env:SQGI_TEST_MSYS_ROOT ucrt64 2>&1 | Tee-Object -FilePath build/native-packaging-tests.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Save all test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: |
            build/*tests.log
            build/*tests.xml
            build/CMakeCache.txt
            build/Testing/Temporary/
            build-preflight/*tests.log
            build-preflight/*tests.xml
            build-preflight/CMakeCache.txt
            build-preflight/Testing/Temporary/
