name: Linux Android tooling and documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-arm64
      ANDROID_HOME: /tmp/sqgi-android-sdk
      ANDROID_SDK_ROOT: /tmp/sqgi-android-sdk
      ANDROID_NDK_HOME: /tmp/sqgi-no-ndk
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config \
            libglib2.0-dev libgirepository1.0-dev libffi-dev libcairo2-dev \
            libglib2.0-bin libxml2-utils gir1.2-soup-3.0 glib-networking \
            gir1.2-gdkpixbuf-2.0 librsvg2-common openjdk-21-jdk curl unzip binutils adb
      - name: Build the ARM packaging runtime
        run: |
          test "$(uname -m)" = aarch64
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSQ_ENABLE_JIT=OFF -DSQGI_ENABLE_KERNELS=OFF
          cmake --build build --target sqgi-bin --parallel 4
          python3 tools/sqgipkg_tests/test_android_setup.py build/sqgi
      - name: Prepare Android packaging without an NDK
        run: |
          build/sqgi tools/sqgipkg setup --platform android --accept-licenses
          build/sqgi tools/sqgipkg setup --platform android --check
          test ! -e "$ANDROID_SDK_ROOT/ndk"
          test ! -e "$ANDROID_NDK_HOME"
      - name: Build APKs and an App Bundle from public packages
        run: |
          build/sqgi tools/sqgipkg build --manifest demo/gtk-gallery-android/sqgipkg.json \
            --platform android --arch arm64-v8a --write-lock
          build/sqgi tools/sqgipkg build --manifest demo/gworldscene-android/sqgipkg.json \
            --platform android --arch arm64-v8a --write-lock
          build/sqgi tools/sqgipkg build --manifest demo/gtk-gallery-android/sqgipkg.json \
            --target android-aab --write-lock
          test ! -e "$ANDROID_SDK_ROOT/ndk"
          test ! -e "$ANDROID_NDK_HOME"
      - name: Save ARM packaging artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-built-on-arm64
          path: |
            demo/gtk-gallery-android/dist-android*/
            demo/gworldscene-android/dist-android*/
            demo/gtk-gallery-android/sqgipkg.lock.json
            demo/gworldscene-android/sqgipkg.lock.json
            build/Testing/Temporary/
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build meson build-essential pkg-config nsis \
            libglib2.0-dev libgirepository1.0-dev libffi-dev libcairo2-dev \
            llvm-18-dev libxml2-utils gir1.2-gtk-4.0 gir1.2-soup-3.0 glib-networking python3-venv
      - name: Build the default runtime and host tools
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE=/usr/bin/python3
          cmake --build build --parallel 4
      - name: Check Android tooling and shared packaging contracts
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error \
            -R '^sqgi_test_(sqgipkg_android|android_setup|sqgipkg_ergonomics|system_module|manifest_contracts|manifest_delivery)$' \
            --output-junit "$GITHUB_WORKSPACE/build/host-tools-tests.xml" || {
              python3 tools/report_ci_failure.py build/host-tools-tests.xml
              exit 1
            }
      - name: Build user documentation
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-venv"
          "$RUNNER_TEMP/docs-venv/bin/pip" install -r tools/docs-requirements.txt
          "$RUNNER_TEMP/docs-venv/bin/mkdocs" build --strict
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-host-tools-test-logs
          path: |
            build/CMakeCache.txt
            build/*tests.xml
            build/Testing/Temporary/
